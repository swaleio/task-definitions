name: Lint task definitions

on:
  pull_request:
    paths:
      - "tasks/**"
      - "tools/lint-definitions.mjs"
      - "package.json"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "tools/lint-definitions.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
