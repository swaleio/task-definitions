name: Publish images

# Builds each swale-built task image and syncs its README to the Docker Hub
# page. A push only proves the image still builds; publishing is deliberate,
# via workflow_dispatch with the version to release, and moves `latest` with it
# so `latest` always names a released version rather than an arbitrary build.
# The published digest is what a task definition pins in exec.image.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to (re)publish: a single name (e.g. git), 'all' for every image under images/, or empty to fall back to changed-since-last-push."
        required: false
        default: "all"
      tag:
        description: "Version to publish, e.g. 1.0.0. Published alongside 'latest'."
        required: true

permissions:
  contents: read
  # Required by attest-build-provenance.
  id-token: write
  attestations: write

env:
  REGISTRY_NAMESPACE: swaleio

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.list.outputs.build }}
      sync: ${{ steps.list.outputs.sync }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 2
      - id: list
        shell: bash
        env:
          IMAGE: ${{ github.event.inputs.image }}
          BEFORE: ${{ github.event.before }}
        run: |
          eng/scripts/discover-images.sh "$IMAGE" "$BEFORE" "$GITHUB_SHA"

  publish:
    needs: discover
    if: needs.discover.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.build) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # The GPU bases unpack to tens of gigabytes and exhaust the runner's root
      # volume (vllm-tools previously failed with 'No space left on device').
      # Reclaim the preinstalled toolchains this workflow never uses.
      - name: Free runner disk space
        shell: bash
        run: |
          before=$(df -BG --output=avail / | tail -n 1 | tr -d ' G')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          after=$(df -BG --output=avail / | tail -n 1 | tr -d ' G')
          echo "free space: ${before}G -> ${after}G"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Log in to Docker Hub as the organization
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_ORGANIZATION_TOKEN }}

      # The Dockerfile owns the per-image title and description. They are fed to
      # metadata-action below because a build --label overrides a Dockerfile LABEL,
      # so without this the generated repository-wide description would win.
      - id: imagemeta
        shell: bash
        run: |
          file="images/${{ matrix.image }}/Dockerfile"
          title=$(grep -m1 '^LABEL org.opencontainers.image.title=' "$file" | cut -d'"' -f2)
          description=$(grep -m1 '^LABEL org.opencontainers.image.description=' "$file" | cut -d'"' -f2)
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ steps.imagemeta.outputs.title }}
            org.opencontainers.image.description=${{ steps.imagemeta.outputs.description }}

      - id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: images/${{ matrix.image }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations need an image exporter, which only exists when pushing.
          provenance: ${{ github.event_name == 'workflow_dispatch' }}
          sbom: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event_name == 'workflow_dispatch'
        with:
          subject-name: docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sync README to Docker Hub
        if: hashFiles(format('images/{0}/README.md', matrix.image)) != ''
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          readme-filepath: images/${{ matrix.image }}/README.md
          short-description: ${{ steps.imagemeta.outputs.description }}

      - name: Report published digest
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Published docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          echo "Pin this digest in the referencing task definition's exec.image." >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  sync-readme:
    needs: discover
    if: needs.discover.outputs.sync != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.sync) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - id: imagemeta
        shell: bash
        run: |
          file="images/${{ matrix.image }}/Dockerfile"
          description=$(grep -m1 '^LABEL org.opencontainers.image.description=' "$file" | cut -d'"' -f2)
          echo "description=$description" >> "$GITHUB_OUTPUT"

      # Docker Hub's management API rejects organization tokens, so this needs a
      # user credential rather than the one the images are pushed with.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          readme-filepath: images/${{ matrix.image }}/README.md
          short-description: ${{ steps.imagemeta.outputs.description }}
