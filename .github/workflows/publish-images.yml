name: Publish images

# Builds the swale-built task images and publishes each one a change touched
# once that change reaches main, then syncs its README to the Docker Hub page.
# An image is tagged with the version of the tool it is built around, which its
# Dockerfile records in /usr/share/swale-image-version; a rebuild that keeps that
# version (a base image refresh, a wrapper fix) adds -r1, -r2, and so on.
# `latest` follows the newest publish. A pull request builds the same images and
# reports the tag each would get, pushing nothing. The published digest is what
# a task definition pins in exec.image.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  pull_request:
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to republish or describe: a single name (e.g. git), or 'all' for every image under images/."
        required: true
        default: "all"
      publish:
        description: "Rebuild and publish the image. Unticked, only its Docker Hub description is refreshed."
        type: boolean
        default: false

permissions:
  contents: read
  # Required by attest-build-provenance.
  id-token: write
  attestations: write

env:
  REGISTRY_NAMESPACE: swaleio

jobs:
  discover:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.list.outputs.build }}
      sync: ${{ steps.list.outputs.sync }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # The whole history, so a pull request diffs from where it branched.
          fetch-depth: 0
      - id: list
        shell: bash
        env:
          IMAGE: ${{ github.event.inputs.image }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          eng/scripts/discover-images.sh "$IMAGE" "$BEFORE" "$HEAD"

  publish:
    # A pull request only builds, so its checks say so.
    name: ${{ github.event_name == 'pull_request' && 'Build' || 'Publish' }} ${{ matrix.image }}
    needs: discover
    # An unticked dispatch is a description refresh, so nothing builds.
    if: needs.discover.outputs.build != '[]' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.build) }}
    # One publish at a time per image, so two never pick the same tag. A pull
    # request only builds, so it gets a group of its own instead of queueing.
    concurrency:
      group: publish-image-${{ matrix.image }}-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # The GPU bases unpack to tens of gigabytes and exhaust the runner's root
      # volume (the vLLM image once failed with 'No space left on device').
      # Reclaim the preinstalled toolchains this workflow never uses.
      - name: Free runner disk space
        shell: bash
        run: |
          before=$(df -BG --output=avail / | tail -n 1 | tr -d ' G')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY" || true
          after=$(df -BG --output=avail / | tail -n 1 | tr -d ' G')
          echo "free space: ${before}G -> ${after}G"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      # Also on pull requests from this repository, so pulling the bases does not
      # hit Docker Hub's anonymous rate limit. A fork's pull request has no
      # secrets and builds anonymously.
      - name: Log in to Docker Hub as the organization
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          password: ${{ secrets.DOCKERHUB_ORGANIZATION_TOKEN }}

      # The Dockerfile owns the labels that describe the software it packages.
      # They are fed to metadata-action below because a build --label overrides a
      # Dockerfile LABEL, so without this the repository's own values win -- and
      # for licenses that is actively wrong: this repository is MIT, the software
      # in the images is not, so every image would claim MIT.
      - id: imagemeta
        shell: bash
        run: |
          file="images/${{ matrix.image }}/Dockerfile"
          for label in title description licenses; do
            value=$(grep -m1 "^LABEL org.opencontainers.image.${label}=" "$file" | cut -d'"' -f2)
            [[ -n "$value" ]] || { echo "::error::${file} has no org.opencontainers.image.${label} label"; exit 1; }
            echo "${label}=${value}" >> "$GITHUB_OUTPUT"
          done

      # Built once and loaded, so the tag can be read from the image itself. The
      # publish below reuses this build's layers from the builder's cache.
      - name: Build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: images/${{ matrix.image }}
          load: true
          tags: candidate/${{ matrix.image }}:build

      - name: Choose the tag
        id: version
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version=$(docker run --rm --entrypoint cat "candidate/$IMAGE:build" /usr/share/swale-image-version)
          tag=$(eng/scripts/next-image-tag.sh "$REGISTRY_NAMESPACE/$IMAGE" "$version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            message="Publishing docker.io/$REGISTRY_NAMESPACE/$IMAGE:$tag (packages version $version)"
          else
            message="Would publish docker.io/$REGISTRY_NAMESPACE/$IMAGE:$tag (packages version $version)"
          fi
          # A notice, so a pull request's checks show each tag; and the summary.
          echo "::notice title=$IMAGE::$message"
          echo "$message." >> "$GITHUB_STEP_SUMMARY"

      - id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ steps.imagemeta.outputs.title }}
            org.opencontainers.image.description=${{ steps.imagemeta.outputs.description }}
            org.opencontainers.image.licenses=${{ steps.imagemeta.outputs.licenses }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - id: build
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: env.PUBLISH == 'true'
        with:
          subject-name: docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Report published digest
        if: env.PUBLISH == 'true'
        run: |
          echo "Published docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}@${{ steps.build.outputs.digest }}"
          echo "\`docker.io/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  sync-readme:
    name: Sync ${{ matrix.image }} README
    # After publish, so a first publish describes the repository it has just
    # created. !cancelled() still runs it when publish is skipped (a README-only
    # change, an unticked dispatch) or fails: a description never waits on a
    # build succeeding. A pull request publishes nothing, so it describes nothing.
    needs: [discover, publish]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.discover.result == 'success' && needs.discover.outputs.sync != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.sync) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - id: imagemeta
        shell: bash
        run: |
          file="images/${{ matrix.image }}/Dockerfile"
          description=$(grep -m1 '^LABEL org.opencontainers.image.description=' "$file" | cut -d'"' -f2)
          echo "description=$description" >> "$GITHUB_OUTPUT"

      # Docker Hub's management API rejects organization tokens, so this needs a
      # user credential rather than the one the images are pushed with.
      - id: published
        shell: bash
        env:
          REPOSITORY: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$REPOSITORY/")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$code" = "200" ] || echo "::notice::$REPOSITORY is not published yet; skipping its description"

      - name: Sync README to Docker Hub
        if: steps.published.outputs.exists == 'true'
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          readme-filepath: images/${{ matrix.image }}/README.md
          short-description: ${{ steps.imagemeta.outputs.description }}
